# =============================================================================
# CI: typecheck, unit tests, unsigned installers and the e2e tests on the
# PACKAGED app, on Windows, macOS (Apple silicon and Intel) and Ubuntu
# (marinoscar/kvox#582, #587)
# =============================================================================
#
# No secret is used here: the installers are unsigned (scripts/dist.mjs says so
# in a notice). Signing, notarization and the GitHub Release are release.yml.
#
# The packaged app is checked as it ships (asar layout and fuses:
# scripts/packaged-app.mjs verify), then driven by Playwright through a copy
# with the one fuse Playwright needs (--inspect) turned back on. On Ubuntu the
# .deb is INSTALLED and the tests run the installed app with the kernel's
# AppArmor restriction on unprivileged user namespaces left in place: the
# profile the .deb ships is what lets the Chromium sandbox start.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install-time and tool telemetry off: this project sends nothing anywhere.
  SCARF_ANALYTICS: 'false'
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  # Unsigned builds: no certificate discovery.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Make sure the Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Electron and its Node
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 npx electron -p "'Electron ' + process.versions.electron + ', Node ' + process.versions.node" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare the database layer
        run: npm run prepare:db

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the unsigned installers
        run: npm run dist

      - name: Installer sizes
        shell: bash
        run: |
          echo "### Installers (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '| File | MB |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in release/*.exe release/*.msi release/*.dmg release/*.zip release/*.AppImage release/*.deb; do
            [ -f "$f" ] || continue
            size=$(node -e "console.log((require('fs').statSync(process.argv[1]).size/1048576).toFixed(1))" "$f")
            echo "| $(basename "$f") | $size |" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify the packaged app (asar layout, fuses)
        run: node scripts/packaged-app.mjs verify

      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "kernel.apparmor_restrict_unprivileged_userns = $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo apt-get install -y ./release/*.deb
          test -f /etc/apparmor.d/kvox-desktop
          sudo aa-status | grep -F kvox-desktop
          dpkg -s kvox-desktop | head -n 12

      - name: Prepare the app for Playwright
        id: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The installed app, in place: its AppArmor profile names /opt/KVox/kvox-desktop.
            sudo "$(command -v node)" scripts/packaged-app.mjs test-copy /opt/KVox/kvox-desktop --in-place
            exe=/opt/KVox/kvox-desktop
          else
            exe="$(node scripts/packaged-app.mjs test-copy)"
          fi
          echo "executable=$exe" >> "$GITHUB_OUTPUT"

      - name: E2E tests (packaged app)
        shell: bash
        env:
          KVOX_E2E_EXECUTABLE: ${{ steps.app.outputs.executable }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - name: Measurements
        if: always()
        shell: bash
        run: |
          if [ -f test-results/metrics.json ]; then
            echo "### Smoke-test measurements (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/metrics.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/signing-*.json
          if-no-files-found: error
          retention-days: 7
