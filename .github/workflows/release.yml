# =============================================================================
# Release: signed, notarized installers for every target as a GitHub Release
# (marinoscar/kvox#587)
# =============================================================================
#
# On a `v*` tag (the tag must equal "v" + package.json's version; a tag with a
# "-", such as v0.1.0-rc.1, is a pre-release):
#
#   build    one job per runner, in the `release` environment (its secrets
#            and variables only): unit tests, installers through
#            scripts/dist.mjs (signs what the secrets allow, says what it did
#            not), signature checks, the packaged smoke test.
#              windows-latest   NSIS, x64 + arm64, Azure Trusted Signing (OIDC)
#              macos-latest     dmg + zip, arm64, Developer ID + notarization
#              macos-15-intel   dmg + zip, x64,   Developer ID + notarization
#              ubuntu-latest    deb + AppImage, x64
#   release  a DRAFT release with every file, the merged latest-mac.yml and
#            SHA256SUMS (GPG-signed when the key exists); then published, but
#            ONLY when Windows was signed and both Mac builds were signed and
#            notarized. Otherwise the draft stays a draft, with a warning,
#            unless the repository variable ALLOW_UNSIGNED_RELEASE is "true":
#            then it is published as a PRE-RELEASE and says it is unsigned.
#
# workflow_dispatch builds and checks everything without creating a release
# (a dry run).
#
# Secrets never reach a log: they are passed as environment variables to the
# step that needs them, files made from them live in $RUNNER_TEMP, and
# scripts/dist.mjs prints variable names only. The list of what to configure
# is in README.md ("Releasing").
# =============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCARF_ANALYTICS: 'false'
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  build:
    name: build (${{ matrix.os }})
    environment: release
    permissions:
      contents: read
      id-token: write # Azure login by OIDC (Windows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64 --arm64
          - os: macos-latest
            args: --mac --arm64
          - os: macos-15-intel
            args: --mac --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Whether each secret exists (a step's `if` cannot read `secrets`).
      HAS_AZURE_LOGIN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_MAC_CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag names this version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Version::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Make sure the Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Typecheck and unit tests
        run: |
          npm run prepare:db
          npm run typecheck
          npm test

      - name: Build the app
        run: npm run build

      # ---- Signing material (each step runs only when its secrets exist) ----------
      - name: Azure login for Trusted Signing (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE_LOGIN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Notarization key (macOS)
        if: runner.os == 'macOS' && env.HAS_NOTARY_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Signing status
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) [ "$HAS_AZURE_LOGIN" = true ] || echo "::warning title=Signing::Windows: no Azure login (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID secrets): the installer will be UNSIGNED" ;;
            macOS)   [ "$HAS_MAC_CERT" = true ] || echo "::warning title=Signing::macOS: no MAC_CERTIFICATE_P12_BASE64 secret: the app will be UNSIGNED"
                     [ "$HAS_NOTARY_KEY" = true ] || echo "::warning title=Signing::macOS: no APPLE_API_KEY_P8_BASE64 secret: the app will NOT be notarized" ;;
          esac

      # ---- Installers ---------------------------------------------------------------
      - name: Build the installers
        shell: bash
        env:
          # Windows (Azure Trusted Signing). Only when the Azure login ran.
          AZURE_SIGNING_ENDPOINT: ${{ env.HAS_AZURE_LOGIN == 'true' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME }}
          # macOS (Developer ID Application certificate, base64 .p12; notarization by API key).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/dist.mjs ${{ matrix.args }} --publish never

      - name: Verify the packaged app (asar layout, fuses)
        run: node scripts/packaged-app.mjs verify

      # ---- Signatures -----------------------------------------------------------------
      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plan = Get-Content release/signing-win32-*.json | ConvertFrom-Json
          if (-not $plan.windowsSigned) { Write-Output "::notice title=Signing::Windows: unsigned build, nothing to verify"; exit 0 }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          foreach ($file in @(Get-ChildItem release/*.exe) + @(Get-Item release/win-unpacked/KVox.exe)) {
            & $signtool.FullName verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $($file.Name)" }
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Output "$($file.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          }

      - name: Verify signatures (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(ls -d release/mac*/KVox.app | head -1)"
          plan="$(cat release/signing-darwin-*.json)"
          if ! echo "$plan" | grep -q '"macSigned": true'; then echo "::notice title=Signing::macOS: unsigned build, nothing to verify"; exit 0; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          if echo "$plan" | grep -q '"macNotarized": true'; then
            spctl -a -vv -t exec "$app"
            xcrun stapler validate "$app"
            for dmg in release/*.dmg; do xcrun stapler validate "$dmg" || spctl -a -vv -t open --context context:primary-signature "$dmg"; done
          fi

      - name: Inspect the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          dpkg -I release/*.deb
          dpkg-deb -c release/*.deb | grep -F ./opt/KVox/resources/apparmor-profile

      # ---- The packaged smoke test ---------------------------------------------------
      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          sudo aa-status | grep -F kvox-desktop

      - name: Prepare the app for Playwright
        id: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo "$(command -v node)" scripts/packaged-app.mjs test-copy /opt/KVox/kvox-desktop --in-place
            exe=/opt/KVox/kvox-desktop
          else
            exe="$(node scripts/packaged-app.mjs test-copy)"
          fi
          echo "executable=$exe" >> "$GITHUB_OUTPUT"

      - name: Smoke test (packaged app)
        shell: bash
        env:
          KVOX_E2E_EXECUTABLE: ${{ steps.app.outputs.executable }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - name: Name the macOS update info by architecture
        if: runner.os == 'macOS'
        shell: bash
        run: mv release/latest-mac.yml "release/latest-mac-$(uname -m).yml"

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/signing-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  release:
    name: release
    needs: build
    if: github.event_name == 'push'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_GPG: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true

      - name: Merge the macOS update info and gate on signing
        id: gate
        run: |
          mkdir -p plans
          mv files/signing-*.json plans/
          node scripts/release-files.mjs merge-mac files/latest-mac.yml files/latest-mac-*.yml
          rm files/latest-mac-*.yml
          node scripts/release-files.mjs gate plans | tee gate.txt
          grep '^publish=' gate.txt >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: node scripts/release-files.mjs checksums files

      - name: Sign the checksums (GPG)
        if: env.HAS_GPG == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LINUX_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output files/SHA256SUMS.asc files/SHA256SUMS
          gpg --batch --verify files/SHA256SUMS.asc files/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          unsigned_note=""
          if [ "${{ steps.gate.outputs.publish }}" != "true" ] && [ "${{ vars.ALLOW_UNSIGNED_RELEASE }}" = "true" ]; then
            # An explicit opt-in (repository variable): unsigned installers are published, always as a pre-release.
            prerelease="--prerelease"
            unsigned_note="**These installers are not code-signed.** Windows SmartScreen and macOS Gatekeeper will warn; see README: Install. Unsigned builds do not auto-update on Windows or macOS."
          fi
          cat > notes.md <<NOTES
          KVox Desktop ${GITHUB_REF_NAME}.

          ${unsigned_note}

          Install: see [README: Install](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install).
          Verify a download: \`sha256sum -c SHA256SUMS --ignore-missing\` (and \`gpg --verify SHA256SUMS.asc SHA256SUMS\` when present).
          NOTES
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --title "KVox ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag files/*

      - name: Publish (every installer signed, or ALLOW_UNSIGNED_RELEASE is "true")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.gate.outputs.publish }}" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
            echo "Published ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ vars.ALLOW_UNSIGNED_RELEASE }}" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
            echo "::warning title=Unsigned release::published as a pre-release with UNSIGNED installers (ALLOW_UNSIGNED_RELEASE=true): $(grep '^reason=' gate.txt | cut -d= -f2- | paste -sd ';' -)"
            { echo "### Published UNSIGNED (pre-release)"; grep '^reason=' gate.txt | sed 's/^reason=/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Not published::the release stays a draft: $(grep '^reason=' gate.txt | cut -d= -f2- | paste -sd ';' -)"
            { echo "### Draft only"; grep '^reason=' gate.txt | sed 's/^reason=/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
