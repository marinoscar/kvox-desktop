# =============================================================================
# electron-builder: KVox Desktop installers (marinoscar/kvox#587)
# =============================================================================
#
# Built by `npm run dist` (scripts/dist.mjs), which adds the signing identity
# when its secrets exist and builds unsigned installers when they do not.
# Released by .github/workflows/release.yml on a `v*` tag.
#
#   Windows  NSIS, per user (no admin), x64 + arm64 in one installer
#   macOS    dmg (install) + zip (updates), hardened runtime, notarized
#   Linux    deb (recommended; ships the AppArmor profile) + AppImage
#
# ASAR ON. The app is one archive, `app.asar`. Unpacked beside it
# (`app.asar.unpacked`), because a process is started from them: the
# migrations and the Prisma config (the Prisma CLI runs the schema engine with
# its working directory there) and the schema engine itself, a native binary.
# src/server/database.ts reads them from there. scripts/packaged-app.mjs
# verifies this layout and the fuses in CI.
#
# THE COPILOT RUNTIME IS NOT HERE (marinoscar/kvox-desktop#23). The GitHub
# Copilot SDK drives a separate runtime of 130 to 175 MB per platform. This
# default installer carries neither it nor the per-platform npm packages that
# hold it (`@github/copilot-sdk-<platform>`, excluded in `files` below): the
# first opt-in downloads it into <userData>/copilot/runtime. The optional
# "with-copilot" flavour is electron-builder.with-copilot.yml (README,
# "Packaging"). tests/unit/packaging.test.ts and `packaged-app.mjs verify` fail
# if the default installer ever gains the runtime or outgrows its size budget.
# =============================================================================
appId: cr.marin.kvox.desktop
productName: KVox
copyright: Copyright © 2026 Oscar Marin
directories:
  output: release
  buildResources: build
asar: true
asarUnpack:
  - prisma/**
  - prisma.config.ts
  - node_modules/@prisma/engines/schema-engine*
  # The on-device embedder's WASM glue (marinoscar/kvox#660). onnxruntime-web loads it with a
  # dynamic import() in a utility process; an ESM import from inside app.asar is not safe, so
  # src/main/embedder.ts imports the unpacked copy. (The .wasm beside it is read with fs, which
  # Electron's asar layer serves, so it stays in the archive.)
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
files:
  - out/**
  - prisma/**
  - prisma.config.ts
  - package.json
  - "!**/*.map"
  # The Copilot runtime packages (one per platform, 130 MB or more each): downloaded
  # on the first opt-in, never packed. (The SDK's own JavaScript stays: it is small.)
  - "!node_modules/@github/copilot-sdk-*/**"
  # onnxruntime-web (marinoscar/kvox#660) ships ~140 MB of browser builds. Node's `require` loads
  # three of its files: dist/ort.node.min.js (the entry, which requires onnxruntime-common) and the
  # WASM glue + binary it hands to the runtime. Everything else in dist/ is dropped.
  - "!node_modules/onnxruntime-web/dist/**"
  - node_modules/onnxruntime-web/dist/ort.node.min.js
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
  # The query compilers of the databases this app does not run. (Prisma Studio
  # and `prisma dev`, ~80 MB, stay: the Prisma CLI loads them eagerly.)
  - "!node_modules/@prisma/client/runtime/*{cockroachdb,mysql,sqlite,sqlserver}*"
  # The generated Prisma client (node_modules/.prisma) is not a package and a
  # dot folder, so the file walk skips it: copied into the archive by hand. (Not
  # as an extraResource: a `resources/app` folder would be loaded INSTEAD of
  # app.asar.)
  - from: node_modules/.prisma
    to: node_modules/.prisma
# The window icon (src/main/app-icon.ts) is read from the resources folder:
# Windows and Linux show it in the taskbar and the switcher. LICENSE.txt is
# Help > View licences.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/linux/icon.png
    to: icon.png
  - from: LICENSE
    to: LICENSE.txt
npmRebuild: false
# Fuses: flipped in the binary right before signing.
#   runAsNode off            the migrations run as utility processes
#                            (src/main/node-scripts.ts): ELECTRON_RUN_AS_NODE
#                            would let anyone run code as the signed KVox and
#                            read its safeStorage key.
#   nodeOptions off, nodeCliInspectArguments off
#                            no NODE_OPTIONS, no --inspect. (The e2e tests drive
#                            a COPY with --inspect turned back on:
#                            scripts/packaged-app.mjs test-copy.)
#   onlyLoadAppFromAsar on, embeddedAsarIntegrityValidation on (macOS, Windows)
#   cookieEncryption on, grantFileProtocolExtraPrivileges off (the window is
#                            served from kvox://)
#   resetAdHocDarwinSignature: an unsigned macOS build keeps a valid ad-hoc
#                            signature (Apple silicon runs nothing without one);
#                            a signed build is re-signed right after anyway.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
# Update metadata (latest*.yml, app-update.yml) for electron-updater. Nothing is
# uploaded by electron-builder (`--publish never`); release.yml uploads. The app
# reads it only when the user turned on "Check for updates" (src/main/updates.ts).
publish:
  provider: github
  owner: marinoscar
  repo: kvox-desktop
  releaseType: draft
win:
  # The KVox mark, generated by `npm run icons` from
  # @marinoscar/kvox-web/brand (never edited by hand). The MSI needs an icon
  # for its shortcuts.
  icon: build/icon.ico
  target:
    - target: nsis
    # An MSI as well (x64 only), for people who deploy with msiexec, winget or
    # group policy. It installs for the current user; there is no "Remove my
    # data" step in an MSI, so the user's data always stays on uninstall.
    - target: msi
      arch:
        - x64
  # Signing: scripts/dist.mjs adds azureSignOptions (Azure Trusted Signing).
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  # The user's data stays unless they tick it away: build/installer.nsh.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: KVox-${version}-win-setup.${ext}
msi:
  oneClick: false
  perMachine: false
  # WiX warnings are errors by default (-wx); they are not useful here.
  warningsAsErrors: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  artifactName: KVox-${version}-win-${arch}.${ext}
mac:
  target:
    - target: dmg
    - target: zip
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing: scripts/dist.mjs (CSC_LINK, APPLE_API_KEY*), or identity=null.
  artifactName: KVox-${version}-mac-${arch}.${ext}
linux:
  # A folder of <n>x<n>.png (16 to 512) for the desktop entry; the Linux
  # packager rejects an .ico. Generated by `npm run icons`.
  icon: build/linux/icons
  target:
    - target: deb
    - target: AppImage
  executableName: kvox-desktop
  # ONE NAME on Linux, so the dock and the taskbar show the KVox icon for the
  # running window (they showed a generic one). Electron sets the window's
  # app_id (Wayland) and WM_CLASS (X11) from package.json `desktopName`; without
  # it Electron 44 derives `kvox` from the product name, while the .deb installed
  # kvox-desktop.desktop with StartupWMClass=KVox, and nothing matched.
  # `desktopName: kvox-desktop.desktop` plus `syncDesktopName` makes the app_id,
  # WM_CLASS, the entry's file name and its StartupWMClass all `kvox-desktop`
  # (the file name it always had, so an upgrade replaces it in place).
  syncDesktopName: true
  category: Office
  maintainer: Oscar Marin <oscar@marin.cr>
  synopsis: Turn the notes you already have into a personal knowledge graph you can ask questions of. Offline-first.
  artifactName: KVox-${version}-linux-${arch}.${ext}
deb:
  # Ubuntu 24.04 confines unprivileged user namespaces, which the Chromium
  # sandbox needs; the profile grants them to /opt/KVox/kvox-desktop only.
  appArmorProfile: build/linux/kvox-desktop.apparmor
